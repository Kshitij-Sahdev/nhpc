<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHPC Hydro Power Plants Weather Warning System</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet.js CSS (Map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
          
    <!-- Custom CSS Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Chart.js (Charts) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Leaflet.js Script (Map) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
            
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark-theme">
    
    <!-- Fullscreen Map Background -->
    <div id="map"></div>
    
    <div class="app-overlay">
        
        <!-- Sidebar - Floating Left -->
        <aside class="sidebar" id="sidebar">
            <header class="sidebar-header">
                <div class="logo-container">
                    <i data-lucide="shield-alert" class="logo-icon alert-red-text animate-pulse"></i>
                    <div class="logo-text">
                        <h1>NHPC Warning</h1>
                        <span class="sub-title">Live Weather Risk Control</span>
                    </div>
                </div>
                <button class="icon-btn toggle-sidebar-btn" onclick="toggleSidebar()" title="Collapse Sidebar">
                    <i data-lucide="chevron-left" id="sidebar-toggle-icon"></i>
                </button>
            </header>
            
            <!-- Statistics Horizontal Bar -->
            <section class="stats-bar">
                <div class="stat-pill red" id="stat-red" title="Critical warning active">
                    <span class="dot"></span>
                    <span class="stat-num">0</span>
                    <span class="stat-label">Alerts</span>
                </div>
                <div class="stat-pill yellow" id="stat-yellow" title="Watch active">
                    <span class="dot"></span>
                    <span class="stat-num">0</span>
                    <span class="stat-label">Watches</span>
                </div>
                <div class="stat-pill green" id="stat-green" title="Safe stations">
                    <span class="dot"></span>
                    <span class="stat-num">0</span>
                    <span class="stat-label">Safe</span>
                </div>
            </section>
            
            <!-- Search Input -->
            <div class="search-container">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="station-search" placeholder="Search catchments or enter lat, lon...">
                <button class="clear-search-btn hidden" id="clear-search-btn" title="Clear Search">
                    <i data-lucide="x"></i>
                </button>
                <div class="search-suggestions hidden" id="search-suggestions">
                    <!-- Dynamic suggestion items inserted here -->
                </div>
            </div>
            
            <!-- Station List -->
            <div class="station-list-container">
                <!-- Custom/Searched Locations Section -->
                <div class="station-group hidden" id="custom-stations-group">
                    <h3 class="group-header">
                        <span>Searched Locations</span>
                        <button class="clear-custom-btn" id="clear-custom-btn" title="Clear all custom locations">Clear All</button>
                    </h3>
                    <ul class="station-list" id="custom-station-list">
                        <!-- Dynamic custom stations inserted here -->
                    </ul>
                </div>
                
                <!-- Official NHPC Catchments Section -->
                <div class="station-group" id="official-stations-group">
                    <h3 class="group-header">Official Catchments</h3>
                    <ul class="station-list" id="station-list">
                        <!-- Dynamic station items inserted here -->
                    </ul>
                </div>
            </div>
            
            <!-- Footer -->
            <footer class="sidebar-footer">
                <div class="update-time">
                    <i data-lucide="clock"></i>
                    <span>Updated: <span id="update-timestamp">Fetching...</span></span>
                </div>
            </footer>
        </aside>
        
        <!-- Sidebar Re-open Button (Hidden when sidebar is open) -->
        <button class="floating-btn open-sidebar-btn hidden" id="open-sidebar-btn" onclick="toggleSidebar()" title="Show Sidebar">
            <i data-lucide="menu"></i>
        </button>
        
        <!-- Details Dashboard - Floating Right (Sliding Panel) -->
        <section class="dashboard-details" id="dashboard-details">
            
            <!-- Close Button for Mobile/Widescreen dismissal -->
            <button class="icon-btn close-dashboard-btn" onclick="closeDashboard()" title="Close Details">
                <i data-lucide="x"></i>
            </button>
            
            <!-- Main Dashboard Content -->
            <div class="active-dashboard" id="active-dashboard">
                
                <!-- Station Header -->
                <header class="dashboard-header">
                    <div class="station-info">
                        <h2 id="selected-plant-name">Tanakpur</h2>
                        <div class="coords-badge">
                            <i data-lucide="map-pin"></i>
                            <span>Lat: <strong id="selected-lat">0.00</strong>, Lon: <strong id="selected-lon">0.00</strong></span>
                        </div>
                    </div>
                    <div class="header-controls">
                        <button id="siren-toggle" class="control-btn muted" onclick="toggleSirenMute()">
                            <i data-lucide="volume-x" id="siren-icon"></i>
                            <span id="siren-text">Mute</span>
                        </button>
                        <div class="alert-status-banner" id="status-banner">
                            <i data-lucide="info" id="status-icon"></i>
                            <span id="status-text">SAFE</span>
                        </div>
                    </div>
                </header>
                
                <!-- Warning Details Banner (if active) -->
                <div class="warning-callout hidden" id="warning-callout">
                    <div class="callout-header">
                        <i data-lucide="alert-triangle"></i>
                        <h4>Active Hazards Detected</h4>
                    </div>
                    <ul id="warning-reasons-list">
                        <!-- Warning text points -->
                    </ul>
                </div>
                
                <!-- Grid of Summary Cards -->
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-icon bg-blue"><i data-lucide="cloud-rain"></i></div>
                        <div class="metric-data">
                            <span class="metric-value" id="val-rain-24h">0.0 mm</span>
                            <span class="metric-label">24h Rain</span>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-icon bg-orange"><i data-lucide="thermometer"></i></div>
                        <div class="metric-data">
                            <span class="metric-value" id="val-temp-range">0-0 °C</span>
                            <span class="metric-label">Temp Range</span>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-icon bg-purple"><i data-lucide="wind"></i></div>
                        <div class="metric-data">
                            <span class="metric-value" id="val-wind-gust">0.0 m/s</span>
                            <span class="metric-label">Wind Gust</span>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-icon bg-green"><i data-lucide="cloud"></i></div>
                        <div class="metric-data">
                            <span class="metric-value" id="val-rain-72h">0.0 mm</span>
                            <span class="metric-label">72h Rain</span>
                        </div>
                    </div>
                </div>
                
                <!-- Forecast Charts Section -->
                <div class="charts-container">
                    <div class="chart-header">
                        <h3>5-Day Forecast Trends</h3>
                        <div class="chart-tabs">
                            <button class="tab-btn active" id="tab-temp" onclick="switchTab('temp-tab')">Temp & RH</button>
                            <button class="tab-btn" id="tab-rain" onclick="switchTab('rain-tab')">Rain & Wind</button>
                        </div>
                    </div>
                    <div class="chart-body">
                        <canvas id="forecastChart"></canvas>
                    </div>
                </div>
                
            </div>
        </section>
    </div>

    <!-- Load Local Forecast Data -->
    <script src="forecast_data.js"></script>
    <!-- Load UI Application Logic -->
    <script src="app.js"></script>
</body>
</html>
