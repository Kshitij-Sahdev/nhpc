services:
  db:
    image: mysql:8.0
    container_name: ndma-db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-ndma_geoalert}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./NDMA-GeoAlert-Dashboard/Dump20260610.sql:/docker-entrypoint-initdb.d/dump.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: ./NDMA-GeoAlert-Dashboard
      dockerfile: Dockerfile
    container_name: ndma-dashboard
    restart: always
    command: gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 4 --timeout 120 run:app
    ports:
      - "5000:5000"
    volumes:
      - ./NDMA-GeoAlert-Dashboard/logs:/app/logs
    env_file:
      - ./NDMA-GeoAlert-Dashboard/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db_data:
    driver: local
