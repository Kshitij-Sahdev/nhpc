services:
  nhpc-dashboard:
    build: .
    container_name: nhpc-dashboard
    ports:
      - "80:80"
    restart: always
    env_file:
      - .env
    volumes:
      # Persists the state transition database so updates aren't lost on restart
      - nhpc_state_volume:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  nhpc_state_volume:
