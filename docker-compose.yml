services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhpc-warning-system
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - APP_PORT=8000
      - PYTHONUNBUFFERED=1
      - WARNING_DISTANCE_KM=25
      - FLASK_ENV=production
    volumes:
      # Persists SQLite database data across container updates in Coolify
      - nhpc_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/catchments/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

volumes:
  nhpc_data:
    name: nhpc_data
